<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} · {{ site.title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/richleland/pygments-css@master/vs.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}]})">
  </script>
  <style>
    body {
      max-width: 720px;
      margin: 60px auto;
      padding: 0 20px;
      font-family: Georgia, serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.8;
    }
    a { color: #333; }
    .home-heading {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .home-heading h1,
    .home-heading p {
      margin: 0;
    }
    .github-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      text-decoration: none;
    }
    .github-button img {
      display: block;
      width: 2rem;
      height: 2rem;
    }
    .github-button:hover {
      opacity: 0.75;
    }
    .github-button:focus-visible {
      outline: 2px solid #333;
      outline-offset: 2px;
    }
    pre {
      background: #f5f5f5;
      padding: 5px;
      overflow-x: auto;
      line-height: 1.3;
    }
    code { font-size: 1em; }
    pre, code { font-family: Consolas, Menlo,'Courier New', monospace; }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1rem 0;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 6px 12px;
      text-align: left;
    }
    th { background: #f5f5f5; }
    .table-scroll {
      margin: 1rem 0;
      overflow-x: auto;
    }
    .table-scroll table {
      min-width: 820px;
      margin: 0;
      font-size: 0.9rem;
    }
    .table-scroll th,
    .table-scroll td {
      white-space: nowrap;
    }
    .article-figure {
      margin: 1.5rem 0;
    }
    .article-figure img {
      display: block;
      max-width: 100%;
      height: auto;
    }
    .article-figure figcaption {
      margin-top: 0.5rem;
      color: #666;
      font-size: 0.9rem;
      text-align: center;
    }
    .comments-section {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  {% unless page.url == "/" %}
  <header><a href="/">← {{ site.title }}</a></header>
  {% endunless %}
  <main>{{ content }}</main>
  {% if page.comments != false and page.date %}
    <div class="comments-section">
      <script src="https://giscus.app/client.js"
              data-repo="FAuditore/FAuditore.github.io"
              data-repo-id="MDEwOlJlcG9zaXRvcnkyOTUxMjE0NDc="
              data-category="General"
              data-category-id="DIC_kwDOEZcyJ84C7gAL"
              data-mapping="pathname"
              data-strict="1"
              data-reactions-enabled="1"
              data-emit-metadata="0"
              data-input-position="top"
              data-theme="preferred_color_scheme"
              data-lang="en"
              data-loading="lazy"
              crossorigin="anonymous"
              async>
      </script>
    </div>
  {% endif %}
</body>
</html>
