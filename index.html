---
layout: default
title: 首页
---

<div class="home-heading">
  <h1>{{ site.title }}</h1>
  <p>
    <a class="github-button" href="https://github.com/FAuditore" target="_blank" rel="noopener noreferrer">GitHub</a>
  </p>
</div>
<ul>
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url }}">{{ post.date | date: "%Y-%m-%d" }} · {{ post.title }}</a>
  </li>
  {% endfor %}
</ul>
